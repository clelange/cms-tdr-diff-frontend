repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: \.(js|mjs|ts|vue)$

      - id: nuxt-typecheck
        name: nuxt typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: ^(app\.vue|components/|composables/|layouts/|middleware/|nuxt\.config\.ts|pages/|plugins/|server/|stores/|tsconfig\.json|package(-lock)?\.json)
